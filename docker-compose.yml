services:
  redis:
    image: redis/redis-stack-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  similarity:
    build: ./services/similarity
    ports:
      - "8000:8000"
    env_file:
      - ./services/similarity/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  proxy:
    build: ./services/proxy
    ports:
      - "8001:8001"
    env_file:
      - ./services/proxy/.env
    environment:
      SIMILARITY_API_URL: http://similarity:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - similarity
